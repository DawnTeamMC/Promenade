org.gradle.jvmargs=-Xmx3G
# Lets Gradle find the Java 17 toolchain that actions/setup-java installs in CI (ignored when the variable is unset)
org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64

# Mod Metadata
# Overridden when releasing (-Pversion=...)
version=0.0.0-dev
mod_id=promenade
mod_name=Promenade
mod_logo=https://raw.githubusercontent.com/DawnTeamMC/Promenade/refs/heads/main/images/icon.png
mod_color=5429032

# check these on https://fabricmc.net/versions.html
# This branch backports the mod to 1.20.1, which is obfuscated: the loaders use Mojang mappings
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)

# Common (vanilla sources, used to compile the shared code)
# Mixin is bundled by both loaders (Forge ships Mixin 0.8.5, so nothing newer may be used)
mixin_version=0.15.4+mixin.0.8.7

# Fabric
loader_version=0.19.5
loom_version=1.18-SNAPSHOT
fabric_api_version=0.92.12+1.20.1

# Forge
# https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html
forge_version=47.4.28
forge_version_range=[47.4,)
# https://projects.neoforged.net/neoforged/moddevgradle (the legacy plugin supports Forge 1.20.1)
moddev_version=2.0.147

# https://maven.terraformersmc.com/releases/com/terraformersmc/biolith-fabric
biolith_version=1.0.1-beta.1

# https://maven.terraformersmc.com/releases/com/terraformersmc/modmenu
modmenu_version=7.2.2
