# Automatically builds and publishes the mod when a new release is created on GitHub.
# It uploads the Fabric and NeoForge jars to GitHub, CurseForge and Modrinth.

name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Generate data files
        run: ./gradlew clean :fabric:runDatagen

      # After data generation, which clears its output folder, where translations are downloaded
      - name: Download translations from Crowdin
        uses: crowdin/github-action@v3
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          create_pull_request: false
          push_translations: false
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Build with Gradle
        run: |
          VERSION=${{ github.event.release.tag_name }}
          # Same as what mc-publish would infer from the tag
          echo "MOD_VERSION=${VERSION#v}" >> $GITHUB_ENV
          ./gradlew build -Pversion=${VERSION#v}

      - name: Read Gradle properties
        id: gradle_properties
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: './gradle.properties'
          properties: 'mod_id mod_name mod_logo mod_color minecraft_version'

      # Project IDs, loaders and dependencies are read from fabric.mod.json
      - name: Publish Fabric jar to GitHub, CurseForge and Modrinth
        id: publish_fabric
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: fabric/build/libs/!(*-@(dev|sources|javadoc)).jar
          name: ${{ github.event.release.name }} (Fabric)
          version: ${{ env.MOD_VERSION }}+fabric
          changelog: ${{ github.event.release.body }}
          java: 25
          game-versions: |
            >=${{ steps.gradle_properties.outputs.minecraft_version }}

          modrinth-featured: false

      - name: Publish NeoForge jar to GitHub, CurseForge and Modrinth
        id: publish_neoforge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 399648
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: GuE5FpvB
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: neoforge/build/libs/!(*-@(dev|sources|javadoc)).jar
          name: ${{ github.event.release.name }} (NeoForge)
          version: ${{ env.MOD_VERSION }}+neoforge
          changelog: ${{ github.event.release.body }}
          loaders: neoforge
          dependencies: |
            biolith(embedded)
          java: 25
          game-versions: |
            >=${{ steps.gradle_properties.outputs.minecraft_version }}

          modrinth-featured: false

      - name: Add job summary
        run: |
          echo "# Results" >> $GITHUB_STEP_SUMMARY
          echo "- Mod ID: ${{ steps.gradle_properties.outputs.mod_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- Mod Name: ${{ steps.gradle_properties.outputs.mod_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Mod Version: ${{ github.event.release.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Release Name: ${{ github.event.release.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Minecraft Version: ${{ steps.gradle_properties.outputs.minecraft_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Fabric: [CurseForge](${{ steps.publish_fabric.outputs.curseforge-url }}) / [Modrinth](${{ steps.publish_fabric.outputs.modrinth-url }})" >> $GITHUB_STEP_SUMMARY
          echo "- NeoForge: [CurseForge](${{ steps.publish_neoforge.outputs.curseforge-url }}) / [Modrinth](${{ steps.publish_neoforge.outputs.modrinth-url }})" >> $GITHUB_STEP_SUMMARY
          echo "- [GitHub Link](${{ steps.publish_fabric.outputs.github-url }})" >> $GITHUB_STEP_SUMMARY
          echo "# Changelog" >> $GITHUB_STEP_SUMMARY
          echo "${{ github.event.release.body }}" >> $GITHUB_STEP_SUMMARY

      - name: Send Discord webhook
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: |
            [{
              "title": "${{ github.event.release.name }} for ${{ steps.gradle_properties.outputs.minecraft_version }} Released",
              "color": ${{ steps.gradle_properties.outputs.mod_color }},
              "thumbnail": {
                "url": "${{ steps.gradle_properties.outputs.mod_logo }}"
              },
              "url": "${{ steps.publish_fabric.outputs.curseforge-url }}",
              "fields": [
                  {
                    "name": "Download now:",
                    "value": "<:curseforge:805066577871110196> CurseForge: [Fabric](${{ steps.publish_fabric.outputs.curseforge-url }}) / [NeoForge](${{ steps.publish_neoforge.outputs.curseforge-url }})\n<:modrinth:805066578215043092> Modrinth: [Fabric](${{ steps.publish_fabric.outputs.modrinth-url }}) / [NeoForge](${{ steps.publish_neoforge.outputs.modrinth-url }})\n[<:github:805066578164580392> GitHub](${{ steps.publish_fabric.outputs.github-url }})",
                    "inline": true
                  }
              ],
              "footer": {
                "text": "A Fabric & NeoForge Mod"
              }
            }]
