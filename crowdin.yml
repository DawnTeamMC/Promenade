project_id: "427504"
api_token_env: "CROWDIN_PERSONAL_TOKEN"
preserve_hierarchy: true

files:
  - source: "common/src/main/generated/assets/promenade/lang/en_us.json"
    translation: "common/src/main/generated/assets/promenade/lang/%locale_with_underscore%.json"
    dest: "promenade.json"
  - source: "docs/**/*.*"
    ignore:
      - "docs/.assets/**/*"
      - "docs/.translated/**/*"
      - "docs/.data/**/*"
      - "docs/sinytra-wiki.json"
    translation: "docs/.translated/%locale_with_underscore%/**/%original_file_name%"
    dest: "promenade-docs/**/%original_file_name%"