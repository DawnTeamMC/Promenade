// Loader-agnostic code, compiled against vanilla Minecraft only.
// This project is never shipped: the loader projects compile its sources into their own jars.
// Anything loader-specific goes through fr.hugman.promenade.platform.
plugins {
    id "net.neoforged.moddev.legacyforge"
}

sourceSets {
    main {
        resources {
            srcDir 'src/main/generated'
            exclude '.cache/**'
        }
    }
    // Client-only code, kept apart so it can't leak into the common (server-safe) code
    client {
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

configurations {
    clientCompileOnly.extendsFrom compileOnly
}

legacyForge {
    // Vanilla mode: Minecraft with Mojang names, without Forge
    mcpVersion = minecraft_version
    // Same access changes as the Fabric access widener
    accessTransformers.from(project(':forge').file('src/main/resources/META-INF/accesstransformer.cfg'))
    addModdingDependenciesTo(sourceSets.client)
}

dependencies {
    // Both loaders ship Mixin. Its own dependencies would downgrade Minecraft's Gson and Guava.
    compileOnly("net.fabricmc:sponge-mixin:${mixin_version}") {
        transitive = false
    }
    compileOnly "org.jetbrains:annotations:26.0.2"

    // Biolith 1.0 has no data-driven placement: the shared code calls its API.
    // Its Forge jar is remapped from SRG to the Mojang names used here.
    modCompileOnly "com.terraformersmc:biolith-forge:${biolith_version}"
}

// Nothing is shipped from here
tasks.withType(Jar).configureEach {
    enabled = false
}
