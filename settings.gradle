pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
		gradlePluginPortal()
	}
}

rootProject.name = 'Promenade'

// Shared (loader-agnostic) sources. They are compiled into each loader's jar.
include 'common'
// Loader-specific entrypoints, metadata and platform implementations.
include 'fabric'
include 'neoforge'
